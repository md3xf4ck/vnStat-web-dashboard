<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>vnStat Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:           #0a0c12;
    --surface:      #111420;
    --surface2:     #181d2e;
    --surface3:     #1e2438;
    --border:       #252d45;
    --border2:      #2e3852;
    --accent:       #3b6fd4;
    --accent-soft:  rgba(59,111,212,.15);
    --accent-glow:  rgba(59,111,212,.35);
    --text:         #dde3f0;
    --text-muted:   #5a6585;
    --text-dim:     #8a96b5;
    --upload:       #ff9f40;
    --download:     #4bc8eb;
    --green:        #4ade80;
    --red:          #f87171;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ════════ LOGIN ════════ */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(59,111,212,.1) 0%, transparent 65%),
      var(--bg);
  }

  .login-box {
    width: 100%;
    max-width: 380px;
    padding: 36px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }

  .login-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .login-logo-icon {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: #fff;
  }

  .login-logo-text {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: .05em;
  }

  .login-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 11px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-muted);
    margin-bottom: 7px;
  }

  .field input {
    width: 100%;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    -webkit-appearance: none;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .btn-login {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity .2s, box-shadow .2s;
  }

  .btn-login:hover { opacity: .9; box-shadow: 0 4px 20px var(--accent-glow); }
  .btn-login:active { opacity: .8; }

  .login-error {
    background: rgba(248,113,113,.08);
    border: 1px solid rgba(248,113,113,.25);
    color: var(--red);
    border-radius: 7px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  /* ════════ APP ════════ */
  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    height: 50px;
    min-height: 50px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 200;
    gap: 8px;
  }

  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-right { display: flex; align-items: center; gap: 8px; }

  .logo { display: flex; align-items: center; gap: 8px; }

  .logo-icon {
    width: 26px; height: 26px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: #fff;
  }

  .logo-text {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
  }

  .refresh-badge {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    white-space: nowrap;
  }

  @media (max-width: 480px) { .refresh-badge { display: none; } }

  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    width: 32px; height: 32px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: color .2s, border-color .2s, background .2s;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-icon:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

  /* ════════ LAYOUT ════════ */
  .main-layout { display: flex; flex: 1; overflow: hidden; }

  aside {
    width: 200px;
    min-width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    transition: transform .25s ease;
  }

  .aside-inner { padding: 14px 0; }

  .aside-label {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--text-muted);
    padding: 0 14px 8px;
  }

  .server-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 14px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .15s, border-color .15s, color .15s;
    font-size: 13px;
    color: var(--text-dim);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .server-item:hover { background: var(--surface2); color: var(--text); }
  .server-item.active { background: var(--surface2); border-left-color: var(--accent); color: var(--text); }

  .server-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }

  .server-dot.ok     { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .server-dot.err    { background: var(--red); }
  .server-dot.loading { background: var(--accent); animation: pulse 1.2s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 150;
  }

  @media (max-width: 640px) {
    aside {
      position: fixed;
      top: 50px; left: 0; bottom: 0;
      z-index: 160;
      transform: translateX(-100%);
      width: 220px; min-width: 220px;
    }
    aside.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    #btnMenu { display: flex !important; }
  }

  .content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
  }

  /* ════════ PANEL ════════ */
  .panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .panel-title {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
  }

  .panel-iface {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    margin-left: 6px;
  }

  .panel-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ctrl-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .07em;
  }

  select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
    max-width: 150px;
  }

  select:focus { border-color: var(--accent); }

  .btn-sm {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-sm:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }
  .btn-sm:disabled { opacity: .5; cursor: default; }

  .updated-at {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  /* ════════ TRAFFIC CARDS ════════ */
  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 720px) { .cards-grid { grid-template-columns: 1fr; } }

  .traffic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px 14px;
    min-width: 0;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .card-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
  }

  .card-label.up { color: var(--upload); }
  .card-label.dn { color: var(--download); }

  .card-hint {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-muted);
  }

  @media (max-width: 400px) { .card-hint { display: none; } }

  .card-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
    margin-bottom: 14px;
  }

  .stat-lbl {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .stat-val {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
  }

  .stat-val.up { color: var(--upload); }
  .stat-val.dn { color: var(--download); }
  .stat-val.sm { font-size: 14px; }

  .card-chart-wrap {
    position: relative;
    height: 130px;
    cursor: pointer;
  }

  @media (max-width: 480px) { .card-chart-wrap { height: 110px; } }

  /* ════════ ERROR / LOADING ════════ */
  .panel-error {
    background: rgba(248,113,113,.07);
    border: 1px solid rgba(248,113,113,.2);
    border-radius: var(--radius);
    padding: 16px 18px;
    color: var(--red);
    font-family: var(--mono);
    font-size: 13px;
    margin-bottom: 14px;
  }

  .panel-loading {
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 13px;
    padding: 60px 0;
    text-align: center;
  }

  /* ════════ MODAL ════════ */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
  }

  @media (min-width: 600px) {
    .modal-bg { align-items: center; padding: 20px; }
  }

  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 20px 16px;
    -webkit-overflow-scrolling: touch;
  }

  @media (min-width: 600px) {
    .modal {
      border-radius: 14px;
      width: min(860px, 100%);
      max-height: 88vh;
      padding: 24px;
    }
  }

  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  @media (min-width: 600px) { .modal-handle { display: none; } }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .modal-title {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
  }

  .modal-close {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    width: 30px; height: 30px; min-width: 30px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: color .2s;
  }

  .modal-close:hover { color: var(--text); }

  .modal-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 600px) { .modal-cards { grid-template-columns: 1fr; } }

  /* ════════ SCROLLBAR ════════ */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

{% if page == "login" %}
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">vn</div>
      <div class="login-logo-text">stat · dashboard</div>
    </div>
    <div class="login-title">Вход</div>
    <div class="login-sub">Мониторинг трафика серверов</div>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="field">
        <label>Логин</label>
        <input type="text" name="username" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" name="password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Войти</button>
    </form>
  </div>
</div>

{% else %}
<div class="app">
  <header>
    <div class="header-left">
      <button class="btn-icon" id="btnMenu" style="display:none" onclick="toggleSidebar()">☰</button>
      <div class="logo">
        <div class="logo-icon">vn</div>
        <div class="logo-text">stat</div>
      </div>
      <div class="refresh-badge" id="globalUpdated">—</div>
    </div>
    <div class="header-right">
      <a href="/logout" class="btn-icon" title="Выйти">⏻</a>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="main-layout">
    <aside id="sidebar">
      <div class="aside-inner">
        <div class="aside-label">Серверы</div>
        <div id="serverList"></div>
      </div>
    </aside>

    <div class="content" id="content">
      <div class="panel-loading">Загрузка данных...</div>
    </div>
  </div>
</div>

<div class="modal-bg" id="minuteModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Детализация по минутам</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-cards" id="modalCards"></div>
  </div>
</div>

<script>
const SERVERS = {{ servers | tojson }};
let currentServer = SERVERS[0] || null;
let currentDay    = null;
let currentInterface = null;
let autoRefreshTimer = null;
let statusTimer      = null;
let mainCharts = {};
let modalCharts = {};

// ── Mobile sidebar ──
function isMobile() { return window.innerWidth <= 640; }
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}
window.addEventListener('resize', () => {
  if (!isMobile()) closeSidebar();
});

// ── Formatters ──
function fmtBytes(b) {
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(i > 1 ? 2 : 0) + ' ' + u[i];
}
function fmtSpeed(bps) {
  if (!bps) return '0 B/s';
  const u = ['B/s','KB/s','MB/s','GB/s'];
  const i = Math.floor(Math.log(Math.max(bps,1)) / Math.log(1024));
  return (bps / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
}
function fmtShort(b) {
  if (!b) return '0 B';
  if (b >= 1e12) return (b/1e12).toFixed(2) + ' T';
  if (b >= 1e9)  return (b/1e9).toFixed(2)  + ' G';
  if (b >= 1e6)  return (b/1e6).toFixed(1)  + ' M';
  if (b >= 1e3)  return (b/1e3).toFixed(0)  + ' K';
  return b + ' B';
}

// ── Chart factory ──
function makeBarChart(ctx, labels, data, color, yFmt, onClickCb) {
  return new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: color + 'bb',
        borderColor: color,
        borderWidth: 0,
        borderRadius: 2,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 250 },
      onClick: onClickCb || null,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a2035',
          borderColor: '#2e3852',
          borderWidth: 1,
          titleColor: '#8a96b5',
          bodyColor: '#dde3f0',
          titleFont: { family: "'JetBrains Mono'", size: 11 },
          bodyFont:  { family: "'JetBrains Mono'", size: 12 },
          callbacks: { label: ctx => yFmt(ctx.raw) }
        }
      },
      scales: {
        x: {
          grid: { color: '#181d2e' },
          ticks: {
            color: '#3a4460',
            font: { family: "'JetBrains Mono'", size: 9 },
            maxRotation: 0,
            autoSkip: true,
            maxTicksLimit: 12
          }
        },
        y: {
          grid: { color: '#181d2e' },
          ticks: {
            color: '#3a4460',
            font: { family: "'JetBrains Mono'", size: 9 },
            callback: v => yFmt(v)
          },
          beginAtZero: true
        }
      }
    }
  });
}

// ── Sidebar ──
function buildSidebar(statuses) {
  const el = document.getElementById('serverList');
  el.innerHTML = SERVERS.map(name => {
    const s = statuses[name] || {};
    const dotClass = !s.has_data ? (s.error ? 'err' : 'loading') : (s.error ? 'err' : 'ok');
    const active = name === currentServer ? ' active' : '';
    const safe = name.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    return `<div class="server-item${active}" data-name="${safe}" onclick="selectServer(this.dataset.name)">
      <div class="server-dot ${dotClass}"></div><span>${safe}</span>
    </div>`;
  }).join('');
}

async function fetchStatuses() {
  try {
    const r = await fetch('/api/servers');
    const data = await r.json();
    buildSidebar(data);
    const upd = data[currentServer];
    if (upd && upd.updated_at) {
      document.getElementById('globalUpdated').textContent = 'обновлено ' + upd.updated_at;
    }
  } catch(e) {}
}

// ── Server select ──
function selectServer(name) {
  currentServer = name;
  currentDay = null;
  currentInterface = null;
  if (isMobile()) closeSidebar();
  loadServerPanel();
}

// ── Traffic card HTML ──
function makeTrafficCard(isUp, data) {
  const cls   = isUp ? 'up' : 'dn';
  const label = isUp ? 'Upload' : 'Download';
  const total = isUp ? data.total_upload    : data.total_download;
  const peakB = isUp ? data.peak_upload_bytes : data.peak_download_bytes;
  const peakS = isUp ? data.peak_upload_speed : data.peak_download_speed;
  const bytes = isUp ? data.upload_bytes : data.download_bytes;
  const avgS  = bytes.length ? Math.round(bytes.reduce((a,b)=>a+b,0) / 3600 / 24) : 0;
  const chartId = isUp ? 'chartUp' : 'chartDn';

  return `<div class="traffic-card">
    <div class="card-header">
      <div class="card-label ${cls}">${label}</div>
      <div class="card-hint">нажми на столбец → минуты</div>
    </div>
    <div class="card-stats">
      <div>
        <div class="stat-lbl">Всего</div>
        <div class="stat-val ${cls}">${fmtShort(total)}</div>
      </div>
      <div>
        <div class="stat-lbl">Пик за час</div>
        <div class="stat-val ${cls}">${fmtShort(peakB)}</div>
      </div>
      <div>
        <div class="stat-lbl">Пик скорости</div>
        <div class="stat-val ${cls} sm">${fmtSpeed(peakS)}</div>
      </div>
      <div>
        <div class="stat-lbl">Средняя скорость</div>
        <div class="stat-val ${cls} sm">${fmtSpeed(avgS)}</div>
      </div>
    </div>
    <div class="card-chart-wrap"><canvas id="${chartId}"></canvas></div>
  </div>`;
}

// ── Main panel ──
async function loadServerPanel() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="panel-loading">Загрузка...</div>';

  document.querySelectorAll('.server-item').forEach(el => {
    el.classList.toggle('active', el.dataset.name === currentServer);
  });

  let url = `/api/data/${encodeURIComponent(currentServer)}`;
  const params = [];
  if (currentDay) params.push('day=' + currentDay);
  if (currentInterface) params.push('interface=' + currentInterface);
  if (params.length) url += '?' + params.join('&');

  let data;
  try {
    const r = await fetch(url);
    data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Ошибка');
  } catch(e) {
    const safe = currentServer.replace(/</g,'&lt;');
    content.innerHTML = `<div class="panel-header"><div class="panel-title">${safe}</div></div>
      <div class="panel-error">⚠ ${e.message}</div>`;
    return;
  }

  Object.values(mainCharts).forEach(c => c.destroy());
  mainCharts = {};

  const hours = Array.from({length:24}, (_,i) => i + ':00');
  const safe  = currentServer.replace(/</g,'&lt;');

  content.innerHTML = `
    <div class="panel-header">
      <div class="panel-title">${safe}<span class="panel-iface">${data.interface||''}</span></div>
      <div class="panel-controls">
        <span class="ctrl-label">Интерфейс</span>
        <select id="ifaceSelect" onchange="changeInterface(this.value)">
          ${(data.interfaces||[]).map(i=>`<option value="${i}"${i===data.interface?' selected':''}>${i}</option>`).join('')}
        </select>
        <span class="ctrl-label">День</span>
        <select id="daySelect" onchange="changeDay(this.value)">
          ${(data.available_days||[]).map(d=>`<option value="${d}"${d===data.date?' selected':''}>${d}</option>`).join('')}
        </select>
        <button class="btn-sm" id="btnRefresh" onclick="manualRefresh()">↻ Обновить</button>
        <span class="updated-at" id="panelUpdated">${data.updated_at ? 'обновлено ' + data.updated_at : ''}</span>
      </div>
    </div>
    <div class="cards-grid">
      ${makeTrafficCard(true,  data)}
      ${makeTrafficCard(false, data)}
    </div>`;

  const clickCb = (evt, elements) => {
    if (elements.length > 0) openMinuteModal(elements[0].index, data.date);
  };

  mainCharts.up = makeBarChart(document.getElementById('chartUp'), hours, data.upload_bytes,   '#ff9f40', fmtBytes, clickCb);
  mainCharts.dn = makeBarChart(document.getElementById('chartDn'), hours, data.download_bytes, '#4bc8eb', fmtBytes, clickCb);
}

function changeDay(day)   { currentDay = day; loadServerPanel(); }
function changeInterface(iface) { currentInterface = iface; loadServerPanel(); }

async function manualRefresh() {
  const btn = document.getElementById('btnRefresh');
  if (btn) { btn.textContent = '↻ ...'; btn.disabled = true; }

  await fetch(`/api/refresh/${encodeURIComponent(currentServer)}`, { method: 'POST' });

  // Poll until server reports new updated_at (max ~9s)
  let tries = 0;
  const prevTime = document.getElementById('panelUpdated')?.textContent || '';

  const poll = setInterval(async () => {
    tries++;
    try {
      const r = await fetch('/api/servers');
      const d = await r.json();
      const upd = d[currentServer];
      if (upd && upd.updated_at) {
        const newLabel = 'обновлено ' + upd.updated_at;
        // Update header badge every poll
        document.getElementById('globalUpdated').textContent = newLabel;

        const panelUpd = document.getElementById('panelUpdated');
        if (panelUpd && panelUpd.textContent !== newLabel) {
          // Data actually refreshed — reload panel
          clearInterval(poll);
          await loadServerPanel();
          return;
        }
      }
    } catch(e) {}

    if (tries >= 8) {
      clearInterval(poll);
      if (btn) { btn.textContent = '↻ Обновить'; btn.disabled = false; }
    }
  }, 1200);
}

// ── Minute modal ──
async function openMinuteModal(hour, day) {
  let url = `/api/minutes/${encodeURIComponent(currentServer)}?hour=${hour}`;
  if (day) url += `&day=${day}`;
  if (currentInterface) url += `&interface=${currentInterface}`;

  const r = await fetch(url);
  const data = await r.json();
  if (data.error) return;

  const h2 = String(hour).padStart(2,'0');
  document.getElementById('modalTitle').textContent =
    `${currentServer}  ·  ${day||''}  ·  ${h2}:00 – ${h2}:59`;

  Object.values(modalCharts).forEach(c => c.destroy());
  modalCharts = {};

  const mins = Array.from({length:60}, (_,i) => i);
  const avgUp = Math.round(data.upload_bytes.reduce((a,b)=>a+b,0)   / 3600);
  const avgDn = Math.round(data.download_bytes.reduce((a,b)=>a+b,0) / 3600);

  document.getElementById('modalCards').innerHTML = `
    <div class="traffic-card">
      <div class="card-header"><div class="card-label up">Upload</div></div>
      <div class="card-stats">
        <div><div class="stat-lbl">Пик трафика</div><div class="stat-val up sm">${fmtShort(data.peak_upload_bytes)}</div></div>
        <div><div class="stat-lbl">Пик скорости</div><div class="stat-val up sm">${fmtSpeed(data.peak_upload_speed)}</div></div>
        <div><div class="stat-lbl">Ср. скорость</div><div class="stat-val up sm">${fmtSpeed(avgUp)}</div></div>
      </div>
      <div class="card-chart-wrap"><canvas id="mUp"></canvas></div>
    </div>
    <div class="traffic-card">
      <div class="card-header"><div class="card-label dn">Download</div></div>
      <div class="card-stats">
        <div><div class="stat-lbl">Пик трафика</div><div class="stat-val dn sm">${fmtShort(data.peak_download_bytes)}</div></div>
        <div><div class="stat-lbl">Пик скорости</div><div class="stat-val dn sm">${fmtSpeed(data.peak_download_speed)}</div></div>
        <div><div class="stat-lbl">Ср. скорость</div><div class="stat-val dn sm">${fmtSpeed(avgDn)}</div></div>
      </div>
      <div class="card-chart-wrap"><canvas id="mDn"></canvas></div>
    </div>`;

  modalCharts.up = makeBarChart(document.getElementById('mUp'), mins, data.upload_bytes,   '#ff9f40', fmtBytes);
  modalCharts.dn = makeBarChart(document.getElementById('mDn'), mins, data.download_bytes, '#4bc8eb', fmtBytes);

  document.getElementById('minuteModal').classList.add('open');
}

function closeModal() {
  document.getElementById('minuteModal').classList.remove('open');
}

// Close on backdrop click
document.getElementById('minuteModal').addEventListener('click', e => {
  if (e.target === document.getElementById('minuteModal')) closeModal();
});

// Swipe down to close on mobile
let _touchY = 0;
document.querySelector('.modal-bg').addEventListener('touchstart', e => {
  _touchY = e.touches[0].clientY;
}, { passive: true });
document.querySelector('.modal-bg').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - _touchY > 80) closeModal();
}, { passive: true });

// ── Init ──
async function init() {
  if (!currentServer) {
    document.getElementById('content').innerHTML = '<div class="panel-loading">Нет серверов в конфигурации</div>';
    return;
  }
  await fetchStatuses();
  await loadServerPanel();
  clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(loadServerPanel, 60000);
  clearInterval(statusTimer);
  statusTimer = setInterval(fetchStatuses, 15000);
}

init();
</script>
{% endif %}
</body>
</html>
